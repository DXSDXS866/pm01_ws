/**:
  ros__parameters:
    # VAD 参数（需现场调）
    energy_threshold: 500      # 短时能量阈值，环境噪声的 2~3 倍
    silence_ms: 450            # 句尾静音(ms)；400~500 响应快，说话慢可调回 800
    # 麦克风设备索引(-1=系统默认)，用 `python3 -m sounddevice` 查列表
    mic_device_index: -1
    # ASR/LLM（阿里云，需 DASHSCOPE_API_KEY）
    llm_model: qwen-flash      # 比 qwen-plus 快 0.3~1.1s；复杂问答可改回 qwen-plus
    # TTS 用阿里云 CosyVoice（云端），需 DASHSCOPE_API_KEY
    tts_model: cosyvoice-v2    # 换 voice 必须同步换 model（v2 配 *_v2 名）
    tts_voice: longshu_v2       # 温暖男声；可选 longxiang_v2/longxiaochen_v2/longwan_v2
    tts_streaming: true        # 首包即播（mpg123）；false=等整段合成再播
